<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prizm lib — torus knot</title>
    <style>
      html, body, canvas { margin: 0; width: 100%; height: 100%; background: #000; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import * as THREE from 'three'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { createPrism, createPrismEnvironment } from '../src/lib/prizm/index.js'

      const canvas = document.querySelector('#c')
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false })
      renderer.setSize(innerWidth, innerHeight)
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.outputColorSpace = THREE.SRGBColorSpace

      const scene = new THREE.Scene()
      scene.background = new THREE.Color('#03040a')
      scene.environment = createPrismEnvironment(renderer)
      scene.environmentIntensity = 3

      const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100)
      camera.position.set(0, 1.2, 4.5)
      const controls = new OrbitControls(camera, canvas)
      controls.enableDamping = true

      const mesh = new THREE.Mesh(new THREE.TorusKnotGeometry(0.85, 0.28, 180, 24))
      scene.add(mesh)
      scene.add(new THREE.DirectionalLight('#fff', 2.2).translateY(3).translateZ(2))

      const wall = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 10),
        new THREE.MeshBasicMaterial({ color: '#dce7f5' }),
      )
      wall.position.z = -3.2
      scene.add(wall)

      const prism = createPrism({ renderer, preset: 'flint', shells: { outerRim: true, innerRim: true } })
      prism.attach(mesh)
      prism.setParams({ dispersion: 1.4, ior: 1.7 })

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
      })

      const t0 = performance.now()
      ;(function frame(now) {
        requestAnimationFrame(frame)
        const t = (now - t0) * 0.001
        mesh.rotation.y += 0.006
        mesh.rotation.x += 0.002
        controls.update()
        prism.beforeRender(renderer, scene, camera)
        prism.update(t)
        renderer.render(scene, camera)
      })(t0)
    </script>
  </body>
</html>
