<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prizm lib — gltf-like group</title>
    <style>
      html, body, canvas { margin: 0; width: 100%; height: 100%; background: #000; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import * as THREE from 'three'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { createPrism, createPrismEnvironment } from '../src/lib/prizm/index.js'

      // No external .glb required — builds a multi-mesh assembly like a loaded glTF root.
      const canvas = document.querySelector('#c')
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false })
      renderer.setSize(innerWidth, innerHeight)
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.outputColorSpace = THREE.SRGBColorSpace

      const scene = new THREE.Scene()
      scene.background = new THREE.Color('#05060a')
      scene.environment = createPrismEnvironment(renderer)
      scene.environmentIntensity = 2.8

      const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100)
      camera.position.set(3.2, 2.1, 4.2)
      const controls = new OrbitControls(camera, canvas)
      controls.enableDamping = true

      const wall = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 10),
        new THREE.MeshBasicMaterial({ color: '#dfe8f4' }),
      )
      wall.position.z = -3
      scene.add(wall)

      const root = new THREE.Group()
      root.name = 'fake-gltf-root'
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.7, 1.4, 48, 1, false))
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.55, 48, 32, 0, Math.PI * 2, 0, Math.PI * 0.5))
      cap.position.y = 0.7
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.08, 24, 64))
      ring.rotation.x = Math.PI / 2
      ring.position.y = 0.15
      root.add(body, cap, ring)
      scene.add(root)

      // Attach prism glass to each mesh in the assembly.
      const prisms = [body, cap, ring].map((mesh, i) => {
        const prism = createPrism({
          renderer,
          preset: i === 2 ? 'flint' : 'crystal',
          shells: { outerRim: true, innerRim: i !== 2 },
        })
        prism.attach(mesh)
        if (i === 2) prism.setParams({ dispersion: 1.35, thickness: 0.35 })
        return prism
      })

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
      })

      const t0 = performance.now()
      ;(function frame(now) {
        requestAnimationFrame(frame)
        const t = (now - t0) * 0.001
        root.rotation.y = t * 0.35
        controls.update()
        for (const p of prisms) {
          const others = [body, cap, ring].filter((m) => m !== p.host)
          p.beforeRender(renderer, scene, camera, others)
          p.update(t)
        }
        renderer.render(scene, camera)
      })(t0)
    </script>
  </body>
</html>
