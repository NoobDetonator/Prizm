<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prizm lib — two instances</title>
    <style>
      html, body, canvas { margin: 0; width: 100%; height: 100%; background: #000; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import * as THREE from 'three'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
      import { createPrism, createPrismStage, createPrismEnvironment } from '../src/lib/prizm/index.js'

      const canvas = document.querySelector('#c')
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false })
      renderer.setSize(innerWidth, innerHeight)
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.outputColorSpace = THREE.SRGBColorSpace

      const scene = new THREE.Scene()
      scene.background = new THREE.Color('#000')
      scene.environment = createPrismEnvironment(renderer)
      scene.environmentIntensity = 2.8

      const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100)
      camera.position.set(0, 1.8, 6)
      const controls = new OrbitControls(camera, canvas)
      controls.enableDamping = true

      const wall = new THREE.Mesh(new THREE.PlaneGeometry(16, 10), new THREE.MeshBasicMaterial({ color: '#f2f5fa' }))
      wall.position.z = -3
      scene.add(wall)

      const a = new THREE.Mesh(new RoundedBoxGeometry(1.4, 1.4, 1.4, 6, 0.12))
      a.position.x = -1.5
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.95, 48, 32))
      b.position.x = 1.5
      scene.add(a, b)

      // One shared refraction plate per frame (2 scene renders total: plate + main).
      const stage = createPrismStage({ renderer })
      const prismA = createPrism({ renderer, preset: 'crystal', engine: 'custom', stage })
      const prismB = createPrism({ renderer, preset: 'glass', engine: 'custom', stage })
      prismA.attach(a)
      prismB.attach(b)
      prismB.setParams({ dispersion: 0.8, caustics: 0.2 })

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(innerWidth, innerHeight)
      })

      const t0 = performance.now()
      ;(function frame(now) {
        requestAnimationFrame(frame)
        const t = (now - t0) * 0.001
        a.rotation.y = t * 0.35
        b.rotation.y = -t * 0.4
        controls.update()
        stage.beforeRender(renderer, scene, camera)
        prismA.update(t)
        prismB.update(t)
        renderer.render(scene, camera)
      })(t0)
    </script>
  </body>
</html>
