<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prizm — Prism Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>

      <header class="hud">
        <p class="brand">Prizm</p>
        <p class="tag">streetwear refraction · cube-only post FX</p>
      </header>

      <aside class="panel" id="controls-panel">
        <p class="panel-section">Look</p>
        <label class="preset-field">
          <span class="row">Artistic preset</span>
          <select id="look">
            <option value="studio" selected>Studio clean</option>
            <option value="voidPrism">Void prism</option>
            <option value="anamorphic">Anamorphic cinema</option>
            <option value="portrait">Soft portrait</option>
            <option value="neonAscii">Neon ASCII</option>
            <option value="ghostTrail">Ghost trail</option>
            <option value="printShop">Print shop</option>
            <option value="prismChaos">Prism chaos</option>
          </select>
          <small id="look-note">baseline optical study</small>
        </label>

        <p class="panel-section">Material</p>
        <label class="preset-field">
          <span class="row">Engine</span>
          <select id="engine">
            <option value="physical" selected>Physical (transmission)</option>
            <option value="custom">Custom (screen-space)</option>
          </select>
        </label>
        <label class="preset-field">
          <span class="row">Glass</span>
          <select id="preset">
            <option value="glass">Crown glass · n≈1.52</option>
            <option value="flint">Flint glass · n≈1.62</option>
            <option value="crystal" selected>Crystal · n≈1.85</option>
          </select>
          <small id="preset-note">n≈1.85 · translucent crystal body</small>
        </label>

        <label>
          <span class="row">Dispersion <em data-value="dispersion">1.35</em></span>
          <input id="dispersion" type="range" min="0" max="2.5" step="0.01" value="1.35" />
        </label>
        <label>
          <span class="row">Thickness <em data-value="thickness">1.75</em></span>
          <input id="thickness" type="range" min="0.1" max="3" step="0.05" value="1.75" />
        </label>
        <label>
          <span class="row">IOR <em data-value="ior">1.85</em></span>
          <input id="ior" type="range" min="1.1" max="2.4" step="0.01" value="1.85" />
        </label>
        <label>
          <span class="row">Roughness <em data-value="roughness">0.050</em></span>
          <input id="roughness" type="range" min="0" max="0.35" step="0.005" value="0.05" />
        </label>
        <label>
          <span class="row">Translucency <em data-value="translucency">0.12</em></span>
          <input id="translucency" type="range" min="0" max="1" step="0.01" value="0.12" />
        </label>
        <label>
          <span class="row">Speckle <em data-value="speckle">0.45</em></span>
          <input id="speckle" type="range" min="0" max="1" step="0.01" value="0.45" />
        </label>

        <p class="panel-section">Post FX</p>
        <label>
          <span class="row">Bloom <em data-value="bloom">0.02</em></span>
          <input id="bloom" type="range" min="0" max="1.5" step="0.01" value="0.02" />
        </label>
        <label>
          <span class="row">Depth of field <em data-value="dof">0.00</em></span>
          <input id="dof" type="range" min="0" max="1" step="0.01" value="0" />
        </label>
        <label>
          <span class="row">DoF focus <em data-value="dof-focus">4.80</em></span>
          <input id="dof-focus" type="range" min="1.5" max="10" step="0.05" value="4.8" />
        </label>
        <label>
          <span class="row">Afterimage <em data-value="afterimage">0.00</em></span>
          <input id="afterimage" type="range" min="0" max="1" step="0.01" value="0" />
        </label>
        <label>
          <span class="row">Halftone <em data-value="halftone">0.00</em></span>
          <input id="halftone" type="range" min="0" max="1" step="0.01" value="0" />
        </label>
        <label>
          <span class="row">ASCII cube <em data-value="ascii">0.00</em></span>
          <input id="ascii" type="range" min="0" max="1" step="0.01" value="0" />
        </label>
        <label>
          <span class="row">ASCII cell <em data-value="ascii-cell">8</em></span>
          <input id="ascii-cell" type="range" min="4" max="28" step="1" value="8" />
        </label>
        <label>
          <span class="row">Chroma <em data-value="chroma">0.70</em></span>
          <input id="chroma" type="range" min="0" max="1.5" step="0.01" value="0.70" />
        </label>
        <label>
          <span class="row">Vignette <em data-value="vignette">0.26</em></span>
          <input id="vignette" type="range" min="0" max="1" step="0.01" value="0.26" />
        </label>
        <label>
          <span class="row">Grain <em data-value="grain">0.35</em></span>
          <input id="grain" type="range" min="0" max="1" step="0.01" value="0.35" />
        </label>

        <p class="panel-section">Render</p>
        <label>
          <span class="row">Env intensity <em data-value="env-intensity">2.50</em></span>
          <input id="env-intensity" type="range" min="0.5" max="6" step="0.05" value="2.5" />
        </label>
        <label class="preset-field">
          <span class="row">Environment</span>
          <select id="env-source">
            <optgroup label="Procedural float HDR">
              <option value="proc:spectral" selected>Spectral blades</option>
              <option value="proc:midnight">Midnight void</option>
              <option value="proc:tungsten">Tungsten studio</option>
              <option value="proc:disco">Disco slits</option>
              <option value="proc:overcast">Overcast dome</option>
              <option value="proc:aurora">Aurora wash</option>
              <option value="proc:liquidVoid">Liquid void</option>
            </optgroup>
            <optgroup label="Artistic plates">
              <option value="art:gradientStudio">Gradient studio</option>
              <option value="art:neonAlley">Neon alley</option>
              <option value="art:paperSky">Paper sky</option>
              <option value="art:emberHall">Ember hall</option>
              <option value="art:iceRink">Ice rink</option>
              <option value="reference">Reference PNG</option>
            </optgroup>
            <optgroup label="External">
              <option value="hdr">External .hdr (/assets/studio.hdr)</option>
            </optgroup>
          </select>
          <small id="env-note">default · rainbow slits + hot suns</small>
        </label>
        <label>
          <span class="row">Exposure <em data-value="exposure">1.08</em></span>
          <input id="exposure" type="range" min="0.4" max="2.2" step="0.01" value="1.08" />
        </label>
        <label>
          <span class="row">Pixel ratio <em data-value="dpr">2.00</em></span>
          <input id="dpr" type="range" min="1" max="2" step="0.05" value="2" />
        </label>
        <label>
          <span class="row">Transmission <em data-value="transmission-scale">1.00</em></span>
          <input id="transmission-scale" type="range" min="0.25" max="1" step="0.05" value="1" />
        </label>
        <label class="preset-field">
          <span class="row">Tone map</span>
          <select id="tonemap">
            <option value="aces" selected>ACES Filmic</option>
            <option value="reinhard">Reinhard</option>
            <option value="cineon">Cineon</option>
            <option value="none">None (linear)</option>
          </select>
        </label>

        <button id="export-render" type="button">Exportar render 2×</button>
      </aside>

      <footer class="hint">arraste para orbitar · scroll para zoom · FX só no cubo · texto refrata atrás</footer>
    </div>
    <script type="module" src="/src/demo/main.js"></script>
  </body>
</html>
